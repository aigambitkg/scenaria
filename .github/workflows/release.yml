name: Release

# Push a tag like v0.9.23 → tests, npm package, single-file binaries for macOS/Linux/Windows with SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The tag matches the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish to npm (needs the NPM_TOKEN secret)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --provenance --access public

  binaries:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            targets: darwin-arm64 darwin-x64
          - os: ubuntu-latest
            name: linux-windows
            targets: linux-x64 linux-arm64 windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-binaries.mjs ${{ matrix.targets }}
      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: for f in release/scenaria-darwin-*; do codesign --force --sign - "$f"; done
      - name: Smoke test (native target)
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) ./release/scenaria-darwin-arm64 --help | head -1 ;;
            Linux-x86_64) ./release/scenaria-linux-x64 --help | head -1 ;;
          esac
      - name: Compress
        run: |
          cd release
          for f in scenaria-*; do
            case "$f" in
              *.exe) zip -9 "${f%.exe}.zip" "$f" && rm "$f" ;;
              *) gzip -9 "$f" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [npm, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true
      - name: Checksums (install.sh and install.ps1 check every download against this file)
        run: |
          cd release
          sha256sum scenaria-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
