name: win-debug
on:
  push:
    branches: [windows-work]
permissions:
  contents: read
concurrency:
  group: win-debug
  cancel-in-progress: true
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: diag
        run: node .github/diag/win.mjs
        continue-on-error: true
      - name: tests
        shell: bash
        run: node --test --test-concurrency=1 $(cat .github/diag/tests.txt)
