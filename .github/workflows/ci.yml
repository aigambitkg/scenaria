name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:ui
      - run: npm test
      - name: The landing page builds
        run: npm run build:site
      - name: No known vulnerabilities in what users install
        run: npm audit --omit=dev --audit-level=moderate

  # Windows runs the same suite. It takes about 30 minutes there (starting git costs more on Windows),
  # so it has its own job with a longer limit.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The PowerShell installer is valid PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - run: npm test
