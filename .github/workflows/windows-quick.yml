name: Windows quick (temporary)

# Only while Windows support is being finished: the test files that failed on Windows, on every push to this branch.
on:
  push:
    branches: [windows]

permissions:
  contents: read

concurrency:
  group: windows-quick
  cancel-in-progress: true

jobs:
  quick:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The PowerShell installer is valid PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - run: node --test --test-concurrency=1 test/execguard.test.mjs test/overlay.test.mjs test/auditfile.test.mjs test/auditpackage.test.mjs test/auditview.test.mjs test/c5.test.mjs test/derivation.test.mjs test/integrity.test.mjs test/office.test.mjs test/site.test.mjs test/simpleui.test.mjs test/windowprogress.test.mjs test/windowstop.test.mjs
